[tool.poetry]
name = "nonebot-plugin-auto-enter-group"
version = "2.0.0"
description = "NoneBot2 加群自动审批"
authors = ["padoru233 <wr15624916906@gmail.com>"]
readme = "README.md"
packages = [{include = "nonebot_plugin_auto_enter_group"}]
repository = "https://github.com/lumenmai/nonebot-plugin-auto-enter-group"
keywords = ["nonebot2", "nonebot-plugin-auto-enter-group"]

[tool.poetry.dependencies]
python = ">=3.10"
nonebot2 = ">=2.2.0,<3"
nonebot-adapter-onebot = "^2.0.0"
nonebot-plugin-localstore = ">=0.7.4,<0.8"

[tool.poetry.group.dev.dependencies]
pytest = ">=8,<9"
pytest-asyncio = ">=0.25,<0.26"
pytest-mock = ">=3.14,<4"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-p no:nonebug"
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = [
    "F",
    "E",
    "W",
    "I",
    "UP",
    "RUF"
]
ignore = [
    "E402",   # module-import-not-at-top-of-file
    "UP006",  # non-pep585-annotation
    "UP035",  # deprecated-import
    "UP037",  # quoted-annotation
    "RUF001", # ambiguous-unicode-character-string
    "RUF002", # ambiguous-unicode-character-docstring
    "RUF003", # ambiguous-unicode-character-comment
]
